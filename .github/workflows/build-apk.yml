name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'

    - name: Set ANDROID_SDK_ROOT
      run: echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV

    - name: Install prerequisites
      run: sudo apt-get update && sudo apt-get install -y wget unzip

    - name: Download and install Android command-line tools
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
      run: |
        set -e
        SDKROOT="$ANDROID_SDK_ROOT"
        mkdir -p "$SDKROOT/cmdline-tools" "$SDKROOT/platform-tools"
        cd "$SDKROOT"
        # حاول تنزيل عدة مرات لو الشبكة متقطعة
        for i in 1 2 3; do
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip && break || sleep 2
        done
        unzip -q cmdline.zip -d tmp_cmdline
        mkdir -p "$SDKROOT/cmdline-tools/latest"
        # بعض الحزم تُنشئ مجلد 'cmdline-tools' داخل الأرشيف
        mv tmp_cmdline/cmdline-tools/* "$SDKROOT/cmdline-tools/latest/" 2>/dev/null || mv tmp_cmdline/* "$SDKROOT/cmdline-tools/latest/" 2>/dev/null || true
        rm -rf tmp_cmdline cmdline.zip
        export PATH="$SDKROOT/cmdline-tools/latest/bin:$PATH"
        sdkmanager --sdk_root="$SDKROOT" --update
        yes | sdkmanager --sdk_root="$SDKROOT" --licenses || true
        sdkmanager --sdk_root="$SDKROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Add Android tools to PATH
      run: |
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build debug APK
      run: ./gradlew --no-daemon clean assembleDebug
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
